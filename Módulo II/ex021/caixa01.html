<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    <title>Modelo de caixas</title>
</head>

<style>

/* box-level*/
h1 {
background-color: rgb(216, 179, 130);
height: 100px;
width: 270px;

border: 10px solid blanchedalmond;

padding: 10px 10px 10px 10px;
padding: 10px;

margin: auto;

outline: 5px auto black;
}

h2 {
background-color: rgb(216, 179, 130);
height: 300px;
width: 300px;
border-width: 10px;
border-style: solid;
border-color: blanchedalmond;

padding-top: 10px;
padding-right: 10px;
padding-bottom: 10px;
padding-left: 10px;

margin-top: 10px;
margin-right: 10px;
margin-bottom: 10px;
margin-left: 10;
}

/* inline-level*/
a {
background-color: rgb(216, 179, 130);
border-width: 10px;
border-style: solid;
border-color: blanchedalmond;

padding-top: 10px;
padding-right: 10px;
padding-bottom: 10px;
padding-left: 10px;

margin-top: 10px;
margin-right: 10px;
margin-bottom: 10px;
margin-left: 30px;
}

</style>
 <body>
    <h1>Exemplos de caixas</h1>
    <h2>Exemplos de caixa box-level</h2>
    <p>Parágrafo também são exemplos de box-level, mas oa <a href="#">links são exemplos de caixas inline-level</a>. Vamos ver como tudo isso funciona.</p>
</body>
</html>
