<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio</title>
</head>

<style>

h1 { 
    text-align: center;
}

table {
    margin: auto;
    width: 700px;
    border-collapse: collapse;
    background-color: white;
    text-align: center;
}

tr {
    height: 35px;
}

tr, th, td {
    border: 1px solid black;
    padding: 10px;
}

td, th, tr {
    padding: 6px 10px;
}


</style>

<body>
    
    <h1>Desafio 1</h1>

   <table>
        <tr>
            <td>1</td>
            <td>2</td>
            <td rowspan="2">3</td>
            <td>4</td>
        </tr>
        <tr>
            <td>5</td>
            <td>6</td>
            <td>7</td>
        </tr>
        <tr>
            <td colspan="3">8</td>
            <td>9</td>
        </tr>
        <tr>
            <td rowspan="2">10</td>
            <td colspan="2">11</td>
            <td>12</td>
        </tr>
        <tr>
            <td>13</td>
            <td>14</td>
            <td>15</td>
        </tr>
    </table>

    <h1>Desafio 1</h1>

    <table>
        <tr>
            <td>1</td>
            <td>2</td>
            <td rowspan="2">3 (rowspan)</td>
            <td>4</td>
        </tr>
        <tr>
            <td>5</td>
            <td>6</td>
            <td>7</td>
        </tr>
        <tr>
            <td colspan="3">8 (colspan)</td>
            <td>9</td>
        </tr>
        <tr>
            <td rowspan="2">10 (rowspan)</td>
            <td colspan="2">11 (colspan)</td>
            <td>12</td>
        </tr>
        <tr>
            <td>13</td>
            <td>14</td>
            <td>15</td>
        </tr>
    </table>

    <h1>Desafio 02</h1>

    <table>
        <tr>
            <td colspan="4">A</td>
            <td rowspan="4">B</td>
        </tr>
        <tr>
            <td rowspan="4">C</td>
            <td>D</td>
            <td>E</td>
            <td>F</td>
        </tr>
        <tr>
            <td>G</td>
            <td>H</td>
            <td>I</td>
        </tr>
        <tr>
            <td>J</td>
            <td>K</td>
            <td>L</td>
        </tr>
        <tr>
            <td colspan="4">M</td>
        </tr>

    </table>

    <h1>Desafio 02</h1>
    <table>
        <tr>
            <td colspan="4">A (colspan)</td>
            <td rowspan="4">B (rowspan)</td>
        </tr>
        <tr>
            <td rowspan="4">C (rowspan)</td>
            <td>D</td>
            <td>E</td>
            <td>F</td>
        </tr>
        <tr>
            <td>G</td>
            <td>H</td>
            <td>I</td>
        </tr>
        <tr>
            <td>J</td>
            <td>K</td>
            <td>L</td>
        </tr>  
        <tr>
            <td colspan="4">M (colspan)</td>
        </tr>

    </table>

</body>
</html>
